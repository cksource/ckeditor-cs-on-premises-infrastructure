name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUBERNETES_VERSION: "1.36.0"
  TERRAFORM_VERSION: "1.16.5"

jobs:
  helm:
    name: Validate Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL --fail -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f kubeconform.tar.gz kubeconform
          rm kubeconform.tar.gz

      - name: List charts
        run: |
          echo "CHARTS=$(find kubernetes/helm -name Chart.yaml -not -path '*/charts/*' -exec dirname {} + | sort | xargs)" >> "$GITHUB_ENV"

      - name: Build chart dependencies
        run: for chart in $CHARTS; do helm dependency build "$chart"; done

      - name: Lint Helm charts
        run: helm lint $CHARTS

      - name: Run kubeconform
        run: |
          rc=0
          for chart in $CHARTS; do
            echo "::group::$chart"
            helm template "$chart" --kube-version "$KUBERNETES_VERSION" \
              | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" - || rc=1
            echo "::endgroup::"
          done
          exit $rc

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate configurations
        run: |
          rc=0
          for dir in $(find aws azure -name '*.tf' -exec dirname {} + | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false \
              && terraform -chdir="$dir" validate || rc=1
            echo "::endgroup::"
          done
          exit $rc
