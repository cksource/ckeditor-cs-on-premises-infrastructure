apiVersion: v2
name: ckeditor-cs-stack
description: CKEditor Collaboration Server On-Premises stack installation

type: application
version: 1.0.0
appVersion: "latest"

dependencies:
  - name: ckeditor-cs
    version: "1.0.0"
    repository: "file://../ckeditor-cs"
  - name: mysql
    condition: mysql.enabled
    version: "1.0.0"
    repository: "file://../misc/mysql"
  - name: redis
    condition: redis.enabled
    version: "1.0.0"
    repository: "file://../misc/redis"
